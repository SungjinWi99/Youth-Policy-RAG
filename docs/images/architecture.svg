<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1050" viewBox="0 0 1200 1050"
     role="img" aria-labelledby="svgTitle svgDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="svgTitle">청년정책 RAG 시스템 아키텍처</title>
  <desc id="svgDesc">main 푸시가 GitHub Actions에서 테스트와 이미지 빌드를 거쳐 Artifact Registry에 올라가고, GCP Compute Engine VM 한 대가 이미지를 받아 Docker Compose로 Caddy, Next.js, FastAPI, LangFeather 네 컨테이너를 띄운다. 브라우저 요청은 80 포트로 Caddy를 거쳐 Next.js와 FastAPI로 이어지고, api 컨테이너 안의 LangGraph RAG가 계획, 검색, 검수, 생성을 수행하며 Upstage 임베딩과 Chat LLM, 온통청년 OpenAPI를 호출한다. 정책 원본과 Chroma 인덱스, SQLite 두 개는 호스트 볼륨의 data 디렉터리에 남는다.</desc>

