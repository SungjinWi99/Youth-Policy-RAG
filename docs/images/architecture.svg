<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1100" viewBox="0 0 1200 1100"
     role="img" aria-labelledby="svgTitle svgDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <title id="svgTitle">청년정책 RAG 배포 아키텍처</title>
  <desc id="svgDesc">main에 푸시하면 GitHub Actions가 test, build and push, deploy 세 job을 차례로 돌린다. 테스트를 통과하면 api와 web 이미지를 빌드해 Artifact Registry에 올리고, IAP 터널 SSH로 GCP VM에 접속해 docker compose pull과 up --wait으로 교체한다. VM은 방화벽에서 tcp 80만 열려 있고 Caddy, Next.js, FastAPI, LangFeather 네 컨테이너가 Compose로 뜬다. 브라우저 요청은 80 포트의 Caddy를 지나 Next.js와 FastAPI로 이어지고, LangFeather는 api와 네트워크를 공유해 loopback으로 트레이스를 받는다. 정책 원본 JSON과 Chroma 인덱스, SQLite 두 개는 호스트 data 디렉터리에 마운트된다. 매일 04:00 KST에 별도 워크플로가 일회용 api 컨테이너로 온통청년 OpenAPI 전체 목록을 대조해 스냅샷과 인덱스를 갱신한다.</desc>

