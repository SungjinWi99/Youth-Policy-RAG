name: youth-policy-rag

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        langfeather-sdk: ../langfeather
    env_file:
      - .env
    environment:
      LANGFEATHER_TRACING: ${LANGFEATHER_TRACING:-true}
      # The local collector runs in the sibling LangFeather Compose project.
      LANGFEATHER_ENDPOINT: http://host.docker.internal:4319
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Chroma index and SQLite databases must survive container replacement.
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
