name: youth-policy-rag

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LANGFEATHER_TRACING: ${LANGFEATHER_TRACING:-true}
      # The langfeather container shares this service's network namespace
      # (see below), so it is reachable over loopback like a local process.
      # LangFeather 0.2.0 only accepts requests whose Host header is
      # localhost/127.0.0.1, so a Compose service-name URL would be rejected.
      LANGFEATHER_ENDPOINT: http://127.0.0.1:4319
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      # Chroma index and SQLite databases must survive container replacement.
      - ./data:/app/data
    # Publishes the LangFeather UI on localhost only; FastAPI's own 8000
    # stays internal-only via `expose`.
    ports:
      - "127.0.0.1:4319:4319"
    expose:
      - "8000"
    # slim 이미지에 curl이 없어 python으로 찌른다. /health는 Chroma 컬렉션
    # 접근만 확인하므로 외부 provider 지연으로 재시작되지 않는다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  langfeather:
    image: ghcr.io/sungjinwi99/langfeather:0.2.0
    network_mode: "service:api"
    volumes:
      - langfeather-data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  langfeather-data:
