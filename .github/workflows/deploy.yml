name: Build and Deploy

on:
  # main에 커밋이 올라오면 자동 실행
  push:
    branches: [main]
  # PR에서는 test job만 돈다 (아래 두 job의 if 조건 참고).
  # 머지 전에 검증이 붙지 않으면 Renovate가 연 PR을 판단할 근거가 없다
  pull_request:
  # Actions 탭에서 손으로 실행 (브랜치 지정 가능). 커밋 없이 배포를 시험할 때 쓴다
  workflow_dispatch:

# 아래 job들이 공유하는 값. 리전을 옮기면 여기만 고치면 된다
env:
  GCP_REGION: asia-northeast3
  GCP_ZONE: asia-northeast3-a
  VM_NAME: youth-policy-rag
  APP_DIR: /opt/youth-policy-rag

jobs:
  # ── job 1. 테스트 문지기. 여기서 깨지면 이미지도 안 만든다 ──────────────
  test:
    runs-on: ubuntu-latest
    steps:
      # 빈 러너에 저장소 코드를 내려받는다
      - uses: actions/checkout@v4

      # uv(파이썬 패키지 매니저) 설치. 러너에 기본 탑재가 아니다
      - uses: astral-sh/setup-uv@v3

      # uv.lock에 적힌 버전 그대로 설치. --frozen이라 잠금 파일을 갱신하려 들면 실패한다
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  # ── job 2. 이미지 빌드 후 Artifact Registry에 푸시 ──────────────────────
  # job은 각각 새 러너(우분투 VM)라 checkout·인증을 다시 해야 한다
  build-and-push:
    # PR에서는 건너뛴다. 없으면 PR을 열 때마다 실제 배포가 나간다
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    # Workload Identity Federation: 장기 키 없이 GitHub이 발급한 OIDC 토큰으로
    # 서비스 계정을 가장한다. id-token 권한이 그 토큰을 받기 위한 것이다.
    permissions:
      contents: read
      id-token: write
    steps:
      # Dockerfile을 빌드해야 하므로 코드가 필요하다
      - uses: actions/checkout@v4

      # OIDC 토큰 → GCP 단명 액세스 토큰 교환.
      # 이후 이 job의 모든 gcloud·docker 명령이 인증된 상태가 된다
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # gcloud CLI 설치
      - uses: google-github-actions/setup-gcloud@v2

      # docker push가 gcloud 자격증명을 쓰도록 자격증명 헬퍼를 등록한다. 없으면 401
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 루트의 Dockerfile로 빌드해서 푸시.
      # tags는 이름이자 업로드 주소다. Artifact Registry는 호스트/프로젝트/저장소/이미지:태그 4단이고,
      # compose.gcp.yaml의 image 값과 정확히 같아야 VM이 찾을 수 있다
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/youth-policy-rag/api:v1

      # frontend/Dockerfile로 빌드해서 푸시
      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/youth-policy-rag/web:v1

  # ── job 3. VM에 접속해 새 이미지로 교체 ────────────────────────────────
  # 이미지는 러너가 보내지 않는다. VM이 자기 서비스 계정으로 직접 pull한다
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # VM에 올릴 compose 파일이 저장소에 있으므로 코드가 필요하다
      - uses: actions/checkout@v4

      # 이 job도 새 러너라 인증을 다시 한다
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # SSH 포트는 인터넷에 열려 있지 않다. IAP 터널로만 들어간다.
      # /opt는 root 소유라 SSH 사용자 홈으로 받은 뒤 sudo로 옮긴다.
      - name: Sync compose config to the VM
        run: |
          # 1) 러너 → VM 홈으로 설정 파일 전송
          gcloud compute scp deploy/compose.gcp.yaml deploy/Caddyfile.http \
            ${{ env.VM_NAME }}:~/ \
            --zone ${{ env.GCP_ZONE }} --tunnel-through-iap
          # 2) VM 안에서 실제 경로로 이동 (set -eu: 한 줄이라도 실패하면 즉시 중단)
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone ${{ env.GCP_ZONE }} --tunnel-through-iap --command '
              set -eu
              sudo install -m 644 ~/compose.gcp.yaml ~/Caddyfile.http ${{ env.APP_DIR }}/
            '

      # --wait은 api의 healthcheck가 healthy가 될 때까지 기다리고, 안 되면 실패한다.
      # 컨테이너가 떴다는 것과 서비스가 정상이라는 것은 다르다.
      - name: Pull and restart
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone ${{ env.GCP_ZONE }} --tunnel-through-iap --command '
              set -eu
              cd ${{ env.APP_DIR }}
              # 새 이미지를 미리 받아 교체 중 중단 시간을 줄인다
              sudo docker compose -f compose.gcp.yaml pull
              # 바뀐 컨테이너만 교체하고 healthy가 될 때까지 최대 3분 대기
              sudo docker compose -f compose.gcp.yaml up -d --wait --wait-timeout 180
              # 교체되어 안 쓰는 이미지 정리 (안 하면 디스크가 찬다)
              sudo docker image prune -f
            '

      # 위 스텝이 실패했을 때만 실행. 컨테이너가 재시작되며 증거가 사라지기 전에
      # 상태와 로그를 Actions 기록에 남긴다
      - name: Dump logs on failure
        if: failure()
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone ${{ env.GCP_ZONE }} --tunnel-through-iap --command '
              cd ${{ env.APP_DIR }}
              sudo docker compose -f compose.gcp.yaml ps
              sudo docker compose -f compose.gcp.yaml logs --tail 100
            '
