# VM의 /opt/youth-policy-rag/.env가 API 키와 함께 IMAGE_REPOSITORY를 담는다.
# (예: IMAGE_REPOSITORY=asia-northeast3-docker.pkg.dev/<프로젝트ID>/youth-policy-rag)
# Compose는 같은 디렉터리의 .env를 ${...} 치환과 api의 env_file 양쪽에 쓴다.
name: youth-policy-rag

services:
  api:
    image: ${IMAGE_REPOSITORY}:api-v1
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      LANGFEATHER_TRACING: ${LANGFEATHER_TRACING:-true}
      # The langfeather container shares this service's network namespace
      # (see below), so it is reachable over loopback like a local process.
      # LangFeather 0.2.0 only accepts requests whose Host header is
      # localhost/127.0.0.1, so a Compose service-name URL would be rejected.
      LANGFEATHER_ENDPOINT: http://127.0.0.1:4319
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ${DATA_DIR:-/opt/youth-policy-rag/data}:/app/data
    # LangFeather UI. The collector has no auth and its traces contain raw
    # user questions, so it is bound to loopback only. To view it, tunnel in:
    #   gcloud compute ssh <vm> --zone <zone> --tunnel-through-iap \
    #     -- -L 4319:127.0.0.1:4319
    ports:
      - "127.0.0.1:4319:4319"
    expose:
      - "8000"
    # slim 이미지에 curl이 없어 python으로 찌른다. /health는 Chroma 컬렉션
    # 접근만 확인하므로 외부 provider 지연으로 재시작되지 않는다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  langfeather:
    image: ghcr.io/sungjinwi99/langfeather:0.2.0
    network_mode: "service:api"
    volumes:
      - ${LANGFEATHER_DATA_DIR:-/opt/youth-policy-rag/langfeather-data}:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: ${IMAGE_REPOSITORY}:web-v1
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.http:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
